    <script type="application/ld+json">

      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Letters Daily?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Letters Daily is a digital adaptation of the classic Name, Place, Animal, Thing (NPAT) word game. Players receive a new target letter every day and must fill out valid answers for all four categories before the timer runs out."

        {
          "@type": "Question",
          "name": "How is scoring calculated in Letters Daily?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Each valid answer earns base points (+5 to +10). Fulfilling daily bonus challenge conditions adds +5 extra points per category. Submitting fast earns a Speed Bonus of up to +20 points."
          }
        },
        {
          "@type": "Question",
          "name": "Can I play more than one round a day?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The official puzzle is one letter a day, played once. To keep playing, start a multiplayer room and race friends: each room round draws its own letter and bonus rule, and room results never affect your daily streak."
